[package]
name = "skl-cli"
version = "0.2.2"
edition = "2024"
description = "AI skills package manager — install, share and manage skills, contexts and agents across your team."
repository = "https://github.com/MathisCrr/skl"
license = "MIT"

[[bin]]
name = "skl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
colored = "2"
dialoguer = "0.12.0"
indicatif = "0.17"
dirs = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.7"
